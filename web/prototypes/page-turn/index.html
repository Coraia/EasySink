<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wise Reader · 阅读翻页原型</title><link rel="stylesheet" href="style.css?v=20261005-focus1"></head>
<body data-theme="paper" data-chrome="closed">
<button id="show-tools" class="top-tools-trigger" aria-label="显示阅读工具" aria-controls="reader-chrome" aria-expanded="false" title="显示阅读工具"></button>
<section id="reader-chrome" class="reader-chrome" hidden role="dialog" aria-modal="true" aria-label="阅读工具层"><button id="chrome-dismiss" class="chrome-dismiss" aria-label="收起阅读工具" title="收起阅读工具"></button>
<header><a href="/" class="brand" title="返回正式版书架">w.</a><div class="running-title"><span>On knowledge and relations</span><small id="chapter-title"></small></div><button id="help" class="quiet" title="原型说明">交互原型</button><button id="fullscreen" class="icon" aria-label="进入全屏" title="进入全屏 · F"></button></header>
<footer><div class="folio"><button id="return-position" class="quiet" hidden>↶ 回到刚才</button><span id="folio-pages"></span><span class="dot">·</span><span id="folio-percent"></span><span id="layout-status"></span></div><nav class="toolbar" aria-label="阅读工具栏"><button id="directory" class="tool" aria-label="目录与书签" title="目录" aria-expanded="false"><span class="tool-icon" aria-hidden="true"></span></button><button id="notes" class="tool" aria-label="阅读笔记" title="笔记" aria-expanded="false"><span class="tool-icon" aria-hidden="true"></span></button><button id="progress" class="tool" aria-label="阅读进度" title="进度" aria-expanded="false"><span class="tool-icon" aria-hidden="true"></span></button><button id="style" class="tool" aria-label="阅读样式" title="样式" aria-expanded="false"><span class="tool-icon" aria-hidden="true"></span></button><button id="font" class="tool" aria-label="字体调整" title="字体" aria-expanded="false"><span class="tool-icon" aria-hidden="true"></span></button></nav><div class="hairline"><div id="hairline-fill"></div></div></footer>
</section>
<main id="stage" class="stage" aria-label="阅读区域">
<button id="prev" class="edge prev" hidden aria-label="上一屏" title="上一屏 · ←"></button>
<div id="spread" class="spread"><section id="left" class="sheet" aria-label="第一页"><div class="page-heading"></div><article class="prose" lang="en"></article><span class="page-number"></span></section><section id="right" class="sheet" aria-label="第二页"><div class="page-heading"></div><article class="prose" lang="en"></article><span class="page-number"></span></section><aside id="translation" class="sheet translation" hidden aria-label="选区对照译文"><div class="translation-head"><span>所选文字 · 对照译文</span><button class="icon" data-close="translation" aria-label="收起译文"></button></div><div id="translation-body"></div><p class="sample-hint">固定样例，未调用 AI</p></aside></div>
<button id="next" class="edge next" hidden aria-label="下一屏" title="下一屏 · →"></button>
</main>

<div id="shade" class="shade" hidden></div><aside id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-label="目录与书签"><div class="panel-head"><h2 id="drawer-title">目录与书签</h2><button class="icon" data-close="drawer" aria-label="关闭目录"></button></div><div class="tabs"><button data-tab="chapters">目录</button><button data-tab="marks">书签</button></div><div id="drawer-content"></div><div class="drawer-bottom"><span>记录仅保存在此原型</span><a href="/">返回正式版书架 ↗</a></div></aside>
<aside id="notes-drawer" class="drawer notes-drawer" hidden role="dialog" aria-modal="true" aria-label="阅读笔记"><div class="panel-head"><h2>阅读笔记</h2><button class="icon" data-close="notes-drawer" aria-label="关闭笔记面板"></button></div><div id="notes-content"></div><p class="drawer-bottom">选中的原文与自己的想法，保存在这里。</p></aside>
<section id="popover" class="popover" hidden role="dialog" aria-label="阅读设置"></section>
<section id="selection" class="selection" hidden aria-label="选区操作"><span id="selection-count"></span><div><button data-action="translate">译文</button><button data-action="grammar">句式</button><button data-action="speak">朗读</button><button data-action="note">记笔记</button><button data-close="selection" aria-label="取消选区">×</button></div></section>
<section id="word-pop" class="word-pop" hidden role="dialog" aria-label="词义与发音"><div class="panel-head"><small>词典释义 · 样例</small><button class="icon" data-close="word-pop" aria-label="关闭词卡"></button></div><h2 id="word-name"></h2><div class="word-audio"><span id="word-ipa"></span><button id="word-speak" class="quiet">听发音</button></div><p id="word-meaning"></p><button id="word-context" class="context">这句话里的意思</button><p id="context-meaning" hidden></p></section>
<dialog id="note-dialog"><form method="dialog"><div class="panel-head"><h2>记住这个想法</h2><button class="icon" value="cancel" aria-label="关闭笔记"></button></div><blockquote id="note-quote"></blockquote><label for="note-body">你的笔记</label><textarea id="note-body" rows="4" placeholder="写下此刻想到的…"></textarea><div class="note-footer"><span>仅保存在此原型</span><button class="primary" value="save">保存笔记</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div><span class="sr-only" id="announcement" aria-live="polite"></span><script type="module" src="app.js?v=20261005-focus1"></script>
</body></html>
