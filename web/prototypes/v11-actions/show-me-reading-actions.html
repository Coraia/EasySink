 <div class="intro"><div><h1>从现在的菜单，看到下一步会发生什么。</h1><p class="muted">“收藏”是保存内容的总称。词卡收藏词语，正文划线留下摘录；笔记仍是你写下的想法。</p></div><div class="key"><span class="tag">已有</span><span class="tag new">拟新增 / 调整</span></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const tokens="The quiet art of paying attention begins when we leave a little room for wonder.".split(" ");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({screen:'selection',sel:[0,tokens.length-1],lines:[],more:false,lex:false,feedback:null,retained:false,meaning:0,context:false,tab:'all',notes:[],hidden:false,skip:[],pick:0,reading:'A · The quiet art of paying attention · 第 12 页',wordDeleted:false});
let state=initial(),undoAction=null,toastTimer=null;
const quote=range=>tokens.slice(range[0],range[1]+1).join(' ');
const union=arr=>arr.sort((a,b)=>a[0]-b[0]).reduce((out,r)=>{const p=out[out.length-1];if(p&&r[0]<=p[1])p[1]=Math.max(p[1],r[1]);else out.push(r.slice());return out},[]);
const matchingLine=()=>state.sel?state.lines.findIndex(r=>r[0]===state.sel[0]&&r[1]===state.sel[1]):-1;
const cloneLines=()=>state.lines.map(r=>r.slice());
function toast(message,undo){clearTimeout(toastTimer);undoAction=undo||null;$('#toast').innerHTML='<span>'+esc(message)+'</span>'+(undo?'<button data-action="undo">撤销</button>':'')+'<button data-action="dismiss-toast" aria-label="关闭提示">×</button>';$('#toast').hidden=false;if(!undo)toastTimer=setTimeout(()=>$('#toast').hidden=true,6500)}
function modal(title,html){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal()}
function closeModal(){$('#dialog').close()}
function noteAside(items,question,status="已确认；排布供体验"){return '<aside class="aside card pad"><h3>这里发生了什么</h3>'+items.map((i,n)=>'<div class="maprow"><span class="mapnum">'+(n+1)+'</span><div><strong>'+i[0]+'</strong><p>'+i[1]+'</p></div></div>').join('')+'<div class="question-box"><span class="tag new">'+status+'</span><p style="margin-top:8px">'+question+'</p></div></aside>'}
function selectionView(){
const range=state.sel,old=['核对原版','记一笔','翻译所选文字','语法分析','在选区加书签','朗读选区','×'];
return '<div class="layout"><div class="stack"><section class="card pad"><div class="cardhead"><h3>现在 · 你截图里的菜单</h3><span class="tag">已有 6 项操作</span></div><div class="toolbar">'+old.map(t=>'<span class="olditem">'+t+'</span>').join('')+'</div><p class="muted small" style="margin-top:12px">现在可以写想法、翻译或加书签；还没有“不写笔记，只留下一段话”的划线入口。</p></section><section class="card pad"><div class="cardhead"><h3>建议 · 在原有流程中加“划线”</h3><span class="tag new">Q11 / Q12</span></div><div class="hint">演示控制 <button data-action="select-all">选整句</button><button data-action="select-middle">选中中间几个词</button><button data-action="select-overlap">选重叠的一段</button><button data-action="select-tail">选末尾一段</button></div><p class="bodytext" id="sentence">'+tokens.map((w,i)=>'<span data-i="'+i+'" class="word '+(range&&i>=range[0]&&i<=range[1]?'selected ':'')+(state.lines.some(r=>i>=r[0]&&i<=r[1])?'lined':'')+'">'+esc(w)+'</span> ').join('')+'</p><div class="toolwrap">'+(range?'<div class="toolbar"><button class="primary" data-action="highlight">'+(matchingLine()>=0?'删除划线':'划线')+'</button><button data-action="note">记一笔</button><button data-existing="翻译所选文字">翻译所选文字</button><button data-existing="语法分析">语法分析</button><button data-action="more" aria-expanded="'+state.more+'">更多 ···</button><button data-action="clear-selection" aria-label="取消选区">×</button></div>':'<p class="small muted">临时选区已消失；已划的线继续保留。可重新选择上面的示例范围。</p>')+(state.more&&range?'<div class="more"><button data-existing="核对原版">核对原版</button><button data-existing="在选区加书签">在选区加书签</button><button data-existing="朗读选区">朗读选区</button>'+'</div>':'')+'</div><div class="legend-line"><span>蓝色：临时选中</span><span>细线：已保存的摘录</span></div><div class="inline-note">'+(state.lines.length?'已留下 '+state.lines.length+' 段摘录；无需填写笔记。 <button data-screen="library" style="text-decoration:underline">去收藏看 →</button>':'试一下：点“划线”，再点“×”，观察蓝色选区消失后留下的细线。')+'</div></section><div class="card pad"><div class="cardhead"><h3>原有操作没有消失</h3><span class="tag new">收纳方式也待确认</span></div><p class="small muted">记一笔、翻译、语法仍直接可点。为避免菜单继续变宽，核对原版、在选区加书签、朗读选区拟收进“更多”。核对原版仅 PDF 出现。</p><p class="small" style="margin-top:10px"><b>不在这里增加：</b>收藏词语、导出、解释版本、“再次遇见”。它们各有自己的入口。</p></div></div>'+noteAside([['只新增一个直接操作','划线 = 保存这段原文，并在正文留下标记。不是新增一套笔记。'],['点击 × 不取消划线','× 只清除临时选区；完整选中这条划线，菜单显示“删除划线”。删除按整条进行。'],['范围不同就合并，不擦除一小段','先选中间 → 划线；再选重叠范围 → 划线。合并后选区对应整条，按钮立即变成“删除划线”。']], 'Q11/Q12 已确认：按入口收藏；每条划线按整体合并或删除。已有操作收进“更多”的排布继续供体验。')+'</div>'}
function wordView(){
return '<div class="layout"><section class="card pad"><div class="cardhead"><h3>词卡 · 收藏的是这里这个用法</h3><span class="tag new">Q13 / Q14 / Q16</span></div><p class="phrase">She sat on the <span style="border-bottom:1px dotted var(--accent)">bank</span> <span class="gloss">〈银行；河岸〉</span> and watched the river.</p><p class="small muted">演示原句 · 正文候选不等于已确定的语境含义。</p><div class="wordcard"><div class="label-line"><div><div class="eyebrow">基础词典释义</div><h2>bank</h2></div><button class="btn '+(state.lex?'active':'')+'" data-action="save-word">'+(state.lex?'★ 已收藏':'☆ 收藏词语')+'</button></div><p class="small muted" style="margin:5px 0">/bæŋk/</p><div class="sense"><span class="pos">n.</span>银行；河岸</div><div class="sense"><span class="pos">v.</span>把钱存入银行；使倾斜</div><p class="small muted">释义为预设示例，未连接真实词典或 AI。</p><div class="context">'+(state.context?'<span class="tag ok">语境解释 · 演示结果</span><p>这里是“河岸”：她坐在河边，看着流水。</p>':'<p class="muted">还没有解释这个词在当前句子里的含义。</p>')+'<button class="btn" data-action="context" style="margin-top:10px">'+(state.context?'查看当前解释':'解释这里的意思')+'</button></div><div class="divider"></div><div class="switches"><button class="btn '+(state.feedback?'active':'')+'" data-action="feedback">'+(state.feedback?'✓ 已懂这里':'已懂这里')+'</button><button class="btn '+(state.retained?'active':'')+'" data-action="retain">'+(state.retained?'✓ 已保留注释':'保留注释')+'</button></div><p class="small muted" style="margin-top:11px">收藏 '+(state.lex?'✓':'—')+' · 理解反馈 '+(state.feedback?'已懂':'未反馈')+' · 明确保留注释 '+(state.retained?'是':'否')+'</p></div><section class="card pad" style="background:var(--bg)"><div class="cardhead"><h3>收藏里的解释更新</h3><span class="tag new">Q13 · 拟新增</span></div><p class="small">当前保存：'+(state.meaning?'“这里指河岸，与下文 river 对应。”':'“银行；河岸”')+'</p><div class="actions"><button class="btn" data-action="meaning">查看新解释示例</button><button class="btn" data-action="my-meaning">写我的释义</button>'+(state.meaning?'<button class="btn" data-action="old-meaning">查看旧解释</button>':'')+'</div><p class="small muted" style="margin-top:10px">为展示更新过程，此处预置了一份收藏快照；和上方收藏开关分开演示。</p></section></section>'+noteAside([['这里才有“收藏词语”','点词 / 查短语 → 词卡 → 收藏。不会挤进每一次段落选区菜单。'],['“已懂这里”承接“已掌握”','是同一个反馈入口；新版只表达理解这里这次用法，不把一个词的所有意思都判为掌握。'],['操作互不代替','收藏不代表不懂；点“已懂这里”也不取消你主动保留的注释。可用撤销回到未反馈。'],['新解释不直接覆盖','查看 → 采用后更新收藏；旧解释和来源仍能回看。我的释义单独保留。']], 'Q13：解释更新由你采用；Q14：撤销恢复之前状态；Q16：词典候选与语境解释分清。')+'</div>'}
function libraryView(){
let cards='';
if(state.tab!=='passages'&&state.lex)cards+='<div class="savedcard"><span class="tag">词语</span><p class="phrase">bank</p><p>She sat on the bank and watched the river.</p><p class="muted small">Riverside notes · 演示来源 · 词典：银行；河岸</p><div class="actions"><button class="btn" data-action="source" data-source="bank">回原文</button><button class="btn" data-action="remove-word">取消收藏</button></div></div>';
if(state.tab!=='words')state.lines.forEach((r,i)=>cards+='<div class="savedcard"><span class="tag">摘录</span><p class="phrase">'+esc(quote(r))+'</p><p class="muted small">The quiet art of paying attention · 演示来源</p><div class="actions"><button class="btn" data-action="source" data-source="excerpt" data-index="'+i+'">回原文</button><button class="btn" data-action="remove-line" data-index="'+i+'">取消收藏整条</button></div></div>');
return '<div class="layout"><section class="card pad"><div class="cardhead"><h3>收藏</h3><span class="tag new">拟新增统一入口</span></div><p class="small muted">词语与摘录在这里找；原有笔记仍有自己的入口。</p><div class="libraryhead"><div class="seg">'+[['all','全部'],['words','词语'],['passages','摘录']].map(t=>'<button data-filter="'+t[0]+'" class="'+(state.tab===t[0]?'active':'')+'">'+t[1]+'</button>').join('')+'</div><button class="btn" data-action="manage">导出 / 清理</button></div>'+(cards||'<div class="empty">这里还没有演示收藏。<br><button data-screen="selection" style="text-decoration:underline">去划线</button> 或 <button data-screen="word" style="text-decoration:underline">收藏一个词</button></div>')+'<div class="divider"></div><h3>笔记 · 独立保留</h3><p class="small muted" style="margin-top:8px">取消上面的收藏，不会删除这里的想法。</p>'+(state.notes.length?state.notes.map(n=>'<div class="savedcard"><p class="small muted">'+esc(n.quote)+'</p><p>'+esc(n.body)+'</p></div>').join(''):'<p class="small muted" style="padding-top:14px">暂无演示笔记。可回第一屏，选中文本后点“记一笔”。</p>')+'</section>'+noteAside([['收藏里管理留下的内容','按词语、摘录查看。划线不是额外生成一条空笔记。'],['每条划线是一个整体','正文“删除划线”和列表取消整条，都移除该条摘录。不会从中间擦掉一段而拆成两条。'],['导出与清理不放在选区菜单','从收藏管理进入，明示影响范围。清理收藏不会顺带清理笔记、掌握反馈或原书。']], 'Q15：阅读成果可导出；清理对象独立。点“导出 / 清理”查看范围示意。')+'</div>'}
const recommendations=[{text:'The quiet art of paying attention begins when we leave a little room for wonder.',book:'The quiet art of paying attention'},{text:'She sat on the bank and watched the river.',book:'Riverside notes'}];
function revisitView(){
const item=recommendations[state.pick];
return '<div class="layout"><section class="card pad"><div class="cardhead"><h3>书架 · 顺便再次遇见</h3><span class="tag new">Q17 / Q18</span></div><p class="small muted">场景起点：你已主动回到书架（或打开全局收藏），再点某条收藏查看原文。不是在 A 书的选区菜单中出现 B 书。下方两条为预置演示收藏。</p>'+(state.hidden?'<div class="empty">推荐卡片已关闭。<br><button class="btn" data-action="show-revisit" style="margin-top:12px">从收藏主动打开</button></div>':'<div class="resurface"><div class="label-line"><span class="eyebrow">再次遇见 · 你的收藏</span><button data-action="hide-revisit" aria-label="关闭再次遇见">×</button></div><p class="phrase">'+item.text+'</p><p class="small muted">'+item.book+' · 演示收藏</p><div class="actions"><button class="btn fill" data-action="source" data-source="recommendation">回原文</button><button class="btn" data-action="next-revisit">换一条</button><button class="btn" data-action="skip-revisit">暂不推荐这条</button><button class="btn" data-screen="library">查看全部</button></div></div>')+'<div class="location" id="location"><b>上次保存的阅读位置</b><br>'+state.reading+'</div><div class="bookrow"><div class="bookcover">A</div><div><strong>The quiet art of paying attention</strong><p class="small muted">来源预览不改写位置 · 上次保存的位置见上方</p></div></div><div class="bookrow"><div class="bookcover" style="background:#e7dfd0">B</div><div><strong>Riverside notes</strong><p class="small muted">收藏了一次 bank 的河岸用法</p></div></div></section>'+noteAside([['不在正文插入推荐','只有书架上的轻量卡片。可以关闭，不增加打卡和考试。'],['从书架 / 全局收藏查看来源','你主动点了哪条收藏，就查看它的来源。关闭预览回到刚才的书架或收藏列表，不自动切书。'],['继续读是另一个明确操作','在预览里点“从这里继续读”，才切换书籍、更新续读位置。跨书不使用“回到刚才”。']], 'Q17/Q18 已确认：从书架 / 全局收藏查看来源先预览，关闭回到入口；明确选择继续读才切换书籍。', 'Q17/Q18 已确认')+'</div>'}
function render(){
document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.screen===state.screen);b.setAttribute('aria-current',b.dataset.screen===state.screen?'page':'false')});
$('#stage').innerHTML=({selection:selectionView,word:wordView,library:libraryView,revisit:revisitView})[state.screen]();
}
function showSource(source,index){
const isBank=source==='bank'||(source==='recommendation'&&state.pick===1),book=isBank?'Riverside notes':'The quiet art of paying attention',text=isBank?'She sat on the bank and watched the river.':source==='excerpt'?quote(state.lines[Number(index)]||[0,tokens.length-1]):recommendations[0].text;
modal('原文预览','<span class="tag">'+book+' · 演示来源</span><p class="phrase" style="margin:22px 0"><mark style="background:var(--amber-bg);color:inherit">'+esc(text)+'</mark></p><p class="small muted">这是从书架 / 收藏列表打开的来源预览；关闭回到该入口，之前保存的阅读位置不变。</p><div class="location">上次保存的位置仍是：'+esc(state.reading)+'</div><div class="actions"><button class="btn fill" data-action="continue-source" data-book="'+book+'">从这里继续读</button><button class="btn" data-action="close-dialog">关闭，回到刚才的入口</button></div>');
}
document.addEventListener('click',e=>{
const screen=e.target.closest('[data-screen]');if(screen){state.screen=screen.dataset.screen;render();return}
const filter=e.target.closest('[data-filter]');if(filter){state.tab=filter.dataset.filter;render();return}
const existing=e.target.closest('[data-existing]');if(existing){modal(existing.dataset.existing+' · 现有操作','<p>这个能力继续保留，本页只演示它在菜单中的位置。</p><p class="muted" style="margin-top:12px">不在对照页调用 AI、语音或原版服务；正式阅读器沿用已有操作流程。</p>');return}
const b=e.target.closest('[data-action]');if(!b)return;
switch(b.dataset.action){
case'reset':state=initial();closeModal();$('#toast').hidden=true;undoAction=null;render();break;
case'close-dialog':closeModal();break;
case'dismiss-toast':$('#toast').hidden=true;break;
case'undo':if(undoAction){const fn=undoAction;undoAction=null;fn();render();toast('已恢复这次操作前的状态')}break;
case'select-all':state.sel=[0,tokens.length-1];render();break;
case'select-middle':state.sel=[5,8];render();break;
case'select-overlap':state.sel=[3,11];render();break;
case'select-tail':state.sel=[12,tokens.length-1];render();break;
case'clear-selection':state.sel=null;state.more=false;render();break;
case'more':state.more=!state.more;render();break;
case'highlight':{
if(!state.sel)return;
const old=cloneLines(),oldSelection=state.sel.slice(),r=state.sel.slice(),index=matchingLine();
if(index>=0){
state.lines.splice(index,1);
}else{
state.lines=union(state.lines.concat([r]));
const merged=state.lines.find(x=>x[0]<=r[0]&&x[1]>=r[1]);
state.sel=merged.slice();
}
const actionSelection=state.sel.slice();
render();
toast(index>=0?'已删除整条划线；笔记和词语收藏保留':'已保存整条划线；菜单已切换为“删除划线”',()=>{
state.lines=old;
if(state.sel&&state.sel[0]===actionSelection[0]&&state.sel[1]===actionSelection[1])state.sel=oldSelection;
});
break}
case'note':modal('记一笔 · 原有入口','<p class="small muted">'+esc(quote(state.sel))+'</p><textarea id="note-text" placeholder="写下你的想法"></textarea><p class="small muted">本对照页使用按钮保存示例；正式产品的自动保存方式不在这里重新设计。</p><div class="actions"><button class="btn fill" data-action="save-note">保存演示笔记</button></div>');break;
case'save-note':{const body=$('#note-text').value.trim();if(!body){$('#note-text').focus();return}state.notes.push({quote:quote(state.sel),body});closeModal();render();toast('笔记已独立保存；取消收藏不会删除它');break}
case'save-word':case'remove-word':{
const old=state.lex;state.lex=b.dataset.action==='remove-word'?false:!state.lex;render();toast(state.lex?'已收藏这里的 bank；没有改变掌握状态':'已取消词语收藏',()=>state.lex=old);break}
case'feedback':{
const old=state.feedback;state.feedback=true;render();toast('已记录理解这次用法；收藏、保留注释不变',()=>state.feedback=old);break}
case'retain':{
const old=state.retained;state.retained=!state.retained;render();toast(state.retained?'已明确保留这里的注释':'已取消明确保留；恢复自动辅助规则',()=>state.retained=old);break}
case'context':state.context=true;render();toast('已展示预设语境解释，没有发起 AI 请求');break;
case'meaning':modal('先查看，再采用','<span class="tag new">预设新解释 · 不会自动覆盖</span><p style="margin:15px 0">这里指河岸，与下文 river 对应。</p><p class="small muted">来源：演示语境解释。采用后旧词典解释仍可回看。</p><div class="actions"><button class="btn fill" data-action="adopt-meaning">采用这份解释</button><button class="btn" data-action="close-dialog">保留原解释</button></div>');break;
case'adopt-meaning':{const old=state.meaning;state.meaning=1;closeModal();render();toast('收藏解释已更新；旧解释仍保留',()=>state.meaning=old);break}
case'old-meaning':modal('此前保存的解释','<p>银行；河岸</p><p class="small muted" style="margin-top:12px">来源：基础词典 · 演示旧快照。原句与来源定位未改变。</p>');break;
case'my-meaning':modal('我的释义','<p class="small muted">只写这次用法的理解，不覆盖词典或 AI 结果。</p><textarea id="my-meaning">'+esc(state.myMeaning||'')+'</textarea><button class="btn fill" data-action="save-my-meaning">保存演示释义</button>');break;
case'save-my-meaning':state.myMeaning=$('#my-meaning').value;closeModal();toast('你的释义已独立保存');break;
case'remove-line':{const old=cloneLines();state.lines.splice(Number(b.dataset.index),1);render();toast('已取消整条摘录；笔记未删除',()=>state.lines=old);break}
case'manage':modal('收藏管理 · 演示范围','<p class="small muted">以下仅影响本演示；正式资料没有被读取或修改。</p><div class="checklist"><label><input id="clean-favorites" type="checkbox" checked> 收藏 '+(state.lines.length+Number(state.lex))+' 条</label><label><input id="clean-notes" type="checkbox"> 笔记 '+state.notes.length+' 条</label><label><input id="clean-feedback" type="checkbox"> 掌握反馈 '+(state.feedback?1:0)+' 条</label></div><p class="small muted">原书不属于本次清理范围。导出只含选定收藏及所选笔记，不包含整书。</p><div class="actions"><button class="btn fill" data-action="export">预览导出内容</button><button class="btn danger" data-action="clean">清理所选演示记录</button></div>');break;
case'export':{
const fav=$('#clean-favorites').checked,notes=$('#clean-notes').checked,feedback=$('#clean-feedback').checked;
const data={prototype:true,collections:fav?{word:state.lex?{text:'bank',context:'She sat on the bank and watched the river.',source:'Riverside notes',explanation:'银行；河岸',explanationSource:'演示词典'}:null,passages:state.lines.map(r=>({quote:quote(r),source:'The quiet art of paying attention'}))}:null,notes:notes?state.notes:[],feedback:feedback?state.feedback:null};
modal('导出内容预览 · Q15','<p class="small muted">可读文件与迁移资料是拟提供的两种用途，本页展示内容范围，不做真实导入导出。</p><pre>'+esc(JSON.stringify(data,null,2))+'</pre>');break}
case'clean':{
const choices={fav:$('#clean-favorites').checked,notes:$('#clean-notes').checked,feedback:$('#clean-feedback').checked};
state.pendingClean=choices;modal('确认清理范围','<p>将清理：'+[choices.fav?'收藏':null,choices.notes?'笔记':null,choices.feedback?'掌握反馈':null].filter(Boolean).join('、')+'。</p><p class="small muted" style="margin-top:10px">未勾选的资料保留；本页是演示，正式原书不受影响。</p><div class="actions"><button class="btn danger" data-action="confirm-clean">确认清理演示记录</button><button class="btn" data-action="close-dialog">取消</button></div>');break}
case'confirm-clean':{const c=state.pendingClean;if(c.fav){state.lex=false;state.lines=[]}if(c.notes)state.notes=[];if(c.feedback)state.feedback=null;closeModal();render();toast('已清理选定演示记录；未选资料保持原状');break}
case'source':showSource(b.dataset.source,b.dataset.index);break;
case'continue-source':state.reading=(b.dataset.book==='Riverside notes'?'B':'A')+' · '+b.dataset.book+' · 收藏原文位置';closeModal();state.screen='revisit';render();toast('已明确切换阅读位置；预览本身不会切换');break;
case'hide-revisit':state.hidden=true;render();break;
case'show-revisit':state.hidden=false;state.skip=[];render();break;
case'next-revisit':{const other=1-state.pick;if(!state.skip.includes(other)){state.pick=other;render()}else toast('本演示已没有其他可推荐内容');break}
case'skip-revisit':state.skip.push(state.pick);if(state.skip.length===2)state.hidden=true;else state.pick=1-state.pick;render();break;
}
});

$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
render();
</script>
</body>
