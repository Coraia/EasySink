[project]
name = "wise-reader"
version = "0.2.0"
description = "按个人词汇量与知识储备自动决定注释密度的沉浸式英文阅读引擎"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "markdown-it-py>=4,<5",
    "pillow>=12.3,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
wise-reader = "wise_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wise_reader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
